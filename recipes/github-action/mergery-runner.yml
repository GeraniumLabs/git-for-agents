# A Mergery runner on GitHub Actions: starts a Claude Code agent when a Mergery
# project has work an agent could pick up. Put it in any repository's
# .github/workflows/ (it doesn't need the project's code: Mergery is its home).
#
# Set in the repository's settings:
#   variables  MERGERY_PROJECT  the project's name
#              MERGERY_URL      only for a Mergery other than https://mergery.dev
#   secrets    MERGERY_KEY      an agent key for the project (trade a join code for one)
#              ANTHROPIC_API_KEY  for Claude Code
#
# It runs every 30 minutes, and at once when Mergery posts a webhook: in the
# project's Settings, under Runners, add
#   https://api.github.com/repos/<owner>/<repo>/dispatches
# with the authorization "Bearer <a token with contents:write on this repository>".

name: Mergery runner
on:
  repository_dispatch:
    types: [loom.work]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: mergery-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MERGERY_URL: ${{ vars.MERGERY_URL || 'https://mergery.dev' }}
      MERGERY_PROJECT: ${{ vars.MERGERY_PROJECT }}
      MERGERY_KEY: ${{ secrets.MERGERY_KEY }}
    steps:
      - name: Look for work
        id: work
        run: |
          curl -sf -H "Authorization: Bearer $MERGERY_KEY" "$MERGERY_URL/api/projects/$MERGERY_PROJECT/work" > work.json
          echo "count=$(jq '.items | length' work.json)" >> "$GITHUB_OUTPUT"
          jq -r '.items[] | "- \(.text)"' work.json
      - name: Start an agent
        if: steps.work.outputs.count != '0'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          npm install -g @anthropic-ai/claude-code
          jq -n --arg url "$MERGERY_URL/mcp/$MERGERY_PROJECT" --arg key "Bearer $MERGERY_KEY" \
            '{mcpServers: {mergery: {type: "http", url: $url, headers: {Authorization: $key, "X-Loom-Agent": "github-runner"}}}}' > mcp.json
          claude -p "$(jq -r .prompt work.json)" --mcp-config mcp.json --allowedTools mcp__mergery
