<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Mergery admin</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<link rel="stylesheet" href="/site.css">
<style>
  .adm { padding: 28px 0 64px; }
  .adm h1 { font-size: 28px; max-width: none; margin: 0 0 4px; }
  .adm h2 { font-size: 19px; margin: 34px 0 10px; }
  .adm .meta { color: var(--muted); font-size: 14px; margin: 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 18px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .tile b { display: block; font-size: 24px; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .tile span { color: var(--muted); font-size: 13px; }
  .chart { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 8px; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 90px; }
  .bars div { flex: 1; background: var(--accent); border-radius: 2px 2px 0 0; min-height: 1px; opacity: .9; }
  .bars div.z { background: var(--line); }
  .axis { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; margin-top: 4px; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .charts h3 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
  @media (max-width: 720px) { .charts { grid-template-columns: 1fr; } }
  .tablewrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: top; }
  th { background: var(--head); font-weight: 600; color: var(--muted); cursor: pointer; user-select: none; position: sticky; top: 0; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: 0; }
  .who { display: flex; align-items: center; gap: 8px; }
  .who img { width: 22px; height: 22px; border-radius: 50%; }
  .tag { font-size: 11.5px; padding: 1px 7px; border-radius: 99px; background: var(--chip); color: var(--muted); margin-left: 4px; }
  .tag.pro { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--accent-ink); }
  .est { color: var(--muted); }
  .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .tools input { font: inherit; font-size: 14px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--edge); background: var(--panel); color: var(--ink); min-width: 0; flex: 1 1 220px; max-width: 320px; }
  .tools label { font-size: 14px; color: var(--muted); }
  .err { color: var(--bad); }
  .state { padding: 60px 0; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="brand" href="/"><span class="logo" aria-hidden="true"><svg viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round"><path class="i" d="M32 12V6" stroke-width="4"/><circle class="a" cx="32" cy="5" r="3.4"/><rect class="i" x="9" y="13" width="46" height="40" rx="12" stroke-width="5"/><path class="i" d="M4 30v8M60 30v8" stroke-width="4.5"/><circle class="a" cx="23" cy="28" r="4.2"/><circle class="a" cx="41" cy="28" r="4.2"/><path class="s" d="M23 32c0 6 9 5 9 11M41 32c0 6-9 5-9 11" stroke-width="3.4"/></svg></span>Mergery</a>
  <nav>
    <a href="/?project=">Open the app</a>
    <button class="button ghost" id="refresh" type="button">Refresh</button>
  </nav>
</div></header>
<main class="wrap adm" id="main"><div class="state">Loading…</div></main>
<script src="/admin.js"></script>
</body>
</html>
