name = "loom"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/mcp", "/mcp/*"]

[[artifacts]]
binding = "ARTIFACTS"
namespace = "loom"

[[durable_objects.bindings]]
name = "PROJECT"
class_name = "ProjectCoordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProjectCoordinator"]

[[r2_buckets]]
binding = "CONTEXT"
bucket_name = "loom-context"

# Local development: no Artifacts binding. The Worker talks to the
# Artifacts shim (shim/artifacts-shim.mjs), which serves real git over HTTP.
[env.local]
vars = { ARTIFACTS_SHIM_URL = "http://127.0.0.1:8790", LOOM_ADMIN_TOKEN = "dev-admin" }

[[env.local.durable_objects.bindings]]
name = "PROJECT"
class_name = "ProjectCoordinator"

[[env.local.r2_buckets]]
binding = "CONTEXT"
bucket_name = "loom-context"
