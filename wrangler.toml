name = "loom"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/mcp", "/mcp/*", "/auth/*", "/oauth/*", "/.well-known/oauth-*", "/.well-known/openid-configuration"]

[[artifacts]]
binding = "ARTIFACTS"
namespace = "loom"

# Data residency: projects that keep their data in the EU. Create the
# namespace with jurisdiction "eu" BEFORE deploying (README, "Data residency"):
# a namespace made any other way is unrestricted for good.
[[artifacts]]
binding = "ARTIFACTS_EU"
namespace = "loom-eu"

[[durable_objects.bindings]]
name = "PROJECT"
class_name = "ProjectCoordinator"

[[durable_objects.bindings]]
name = "CHECKS"
class_name = "CheckRunner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProjectCoordinator"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CheckRunner"]

# Each project's checks run in a container owned by its CheckRunner Durable Object.
[[containers]]
name = "loom-checks"
class_name = "CheckRunner"
scheduling_policy = "durable_object"

[containers.images]
checks = { dockerfile = "./checks/Dockerfile" }

[[r2_buckets]]
binding = "CONTEXT"
bucket_name = "loom-context"

[[r2_buckets]]
binding = "CONTEXT_EU"
bucket_name = "loom-context-eu"
jurisdiction = "eu"

# Artifacts event subscriptions: each workspace's pushes arrive here (src/events.ts).
[[queues.consumers]]
queue = "loom-artifacts-events"
max_batch_size = 20
max_batch_timeout = 1

# Projects a first-time visitor sees first; the first one opens by default.
# Leave empty to open the newest public project.
# Workers AI: Clef judges for the deputy when a project brings no key of its own.
[ai]
binding = "AI"

# Email people when something needs them (Cloudflare Email Service). Needs a
# domain onboarded to Email Service; uncomment and set LOOM_EMAIL_FROM on it.
# [[send_email]]
# name = "EMAIL"

[vars]
LOOM_SHOWCASE = "todo-swarm,contest-and-votes,checks-in-the-queue,code-review"
# Who may create projects: "*" is anyone signed in, on the free plan until
# they pay for Loom Pro (needs STRIPE_SECRET_KEY and STRIPE_WEBHOOK_SECRET).
# A list of logins makes it invite-only: anyone else joins a waitlist, and the
# admin lets them in (POST /api/admin/creators).
LOOM_CREATORS = "*"

# Local development: no Artifacts binding. The Worker talks to the
# Artifacts shim (shim/artifacts-shim.mjs), which serves real git over HTTP.
[env.local]
vars = { ARTIFACTS_SHIM_URL = "http://127.0.0.1:8790", LOOM_ADMIN_TOKEN = "dev-admin", LOOM_DEV_LOGIN = "1", LOOM_OWNERS = "jonathanherr", LOOM_REVIEW_MODEL_URL = "http://127.0.0.1:8790/anthropic", LOOM_EMAIL_FROM = "loom@loom.test", LOOM_CREATORS = "jonathanherr", STRIPE_SECRET_KEY = "sk_test_local", STRIPE_WEBHOOK_SECRET = "whsec_local", STRIPE_API_URL = "http://127.0.0.1:8790/stripe" }

# Email locally is simulated: wrangler dev logs each message instead of sending it.
[[env.local.send_email]]
name = "EMAIL"

[[env.local.durable_objects.bindings]]
name = "PROJECT"
class_name = "ProjectCoordinator"

[[env.local.r2_buckets]]
binding = "CONTEXT"
bucket_name = "loom-context"

# EU projects locally: the shim stands in for both namespaces.
[[env.local.r2_buckets]]
binding = "CONTEXT_EU"
bucket_name = "loom-context-eu"
jurisdiction = "eu"
