name = "loom"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/mcp", "/mcp/*", "/auth/*"]

[[artifacts]]
binding = "ARTIFACTS"
namespace = "loom"

[[durable_objects.bindings]]
name = "PROJECT"
class_name = "ProjectCoordinator"

[[durable_objects.bindings]]
name = "CHECKS"
class_name = "CheckRunner"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ProjectCoordinator"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["CheckRunner"]

# Each project's checks run in a container owned by its CheckRunner Durable Object.
[[containers]]
name = "loom-checks"
class_name = "CheckRunner"
scheduling_policy = "durable_object"

[containers.images]
checks = { dockerfile = "./checks/Dockerfile" }

[[r2_buckets]]
binding = "CONTEXT"
bucket_name = "loom-context"

# Local development: no Artifacts binding. The Worker talks to the
# Artifacts shim (shim/artifacts-shim.mjs), which serves real git over HTTP.
[env.local]
vars = { ARTIFACTS_SHIM_URL = "http://127.0.0.1:8790", LOOM_ADMIN_TOKEN = "dev-admin", LOOM_DEV_LOGIN = "1", LOOM_OWNERS = "jonathanherr" }

[[env.local.durable_objects.bindings]]
name = "PROJECT"
class_name = "ProjectCoordinator"

[[env.local.r2_buckets]]
binding = "CONTEXT"
bucket_name = "loom-context"
